# The defaults (512m heap, 384m metaspace) run the daemon out of metaspace part way through a
# full `check` on this project, which surfaces as an OutOfMemoryError or an EOFException from a
# KSP worker rather than as anything that names memory.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g

kotlin.code.style=official
kotlin.stdlib.default.dependency=false
org.gradle.parallel=true
version=2.0.0
